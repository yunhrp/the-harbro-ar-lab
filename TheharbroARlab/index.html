
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>THE HARBRO AR LAB</title>

<script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
  }

  #controls {
    position: fixed;
    top: 15px;
    left: 0;
    width: 100%;
    z-index: 100;
    text-align: center;
    color: white;
    pointer-events: none;
  }

  #controls button,
  #controls input {
    pointer-events: auto;
  }

  #controls h2 {
    color: #D6B45C;
    text-shadow: 0 2px 5px #333;
  }

  button {
    background: #1677FF;
    color: white;
    border: 0;
    border-radius: 7px;
    padding: 10px 18px;
    margin: 4px;
    cursor: pointer;
  }

  #volume {
    width: 110px;
    vertical-align: middle;
  }

  #status {
    font-size: 13px;
    text-shadow: 0 1px 4px black;
  }
</style>
</head>

<body>

<div id="controls">
  <h2>THE HARBRO AR LAB</h2>
  <div>3D FLOATING VIDEO ADVERTISEMENT</div>

  <button id="play">PLAY</button>
  <button id="pause">PAUSE</button>
  <button id="mute">MUTE</button>

  <label>
    Volume
    <input id="volume" type="range"
           min="0" max="1" step="0.05" value="1">
  </label>

  <p id="status">Ready to play</p>
</div>

<a-scene
  background="color: #EAF5FF"
  renderer="colorManagement: true">

  <a-assets>
    <video
      id="adVideo"
      src="assets/video/iklan.mp4"
      preload="auto"
      playsinline
      loop>
    </video>
  </a-assets>

  <!-- Gold 3D Frame -->

  
  
  <a-box
    id="goldFrame"
    position="0 1.6 -3.02"
    width="1.47"
    height="2.52"
    depth="0.06"
    material="color: #D6B45C; metalness: 0.6">
  </a-box>

  <a-video
    id="videoScreen"
    src="#adVideo"
    position="0 1.6 -2.98"
    width="1.35"
    height="2.40">
  </a-video>
  
    <!-- Ground -->
  <a-plane
    position="0 0 -4"
    rotation="-90 0 0"
    width="15"
    height="15"
    color="#FFFFFF">
  </a-plane>

  <a-camera position="0 1.6 0"></a-camera>

</a-scene>

<script>
  const video = document.querySelector("#adVideo");
  const status = document.querySelector("#status");

  
  document.querySelector("#play").onclick = async () => {
  try {
    video.muted = false;
    video.volume = Number(
      document.querySelector("#volume").value
    );

    await video.play();

    status.textContent = "Advertisement Playing";
  } catch (error) {
    status.textContent = "Audio/video playback error";
    console.error(error);
  }
};

  document.querySelector("#pause").onclick = () => {
    video.pause();
    status.textContent = "Advertisement Paused";
  };

  document.querySelector("#mute").onclick = () => {
    video.muted = !video.muted;
    status.textContent = video.muted ? "Muted" : "Sound On";
  };

  document.querySelector("#volume").oninput = (event) => {
    video.volume = Number(event.target.value);
    video.muted = false;
  };
</script>

</body>
</html>
