
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>THE HARBRO AR LAB</title>

  <!-- A-FRAME -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MINDAR IMAGE TRACKING -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #071525;
    }

    #header {
      position: fixed;
      top: 12px;
      left: 0;
      width: 100%;
      z-index: 20;
      text-align: center;
      color: #D6B45C;
      font-size: 21px;
      font-weight: bold;
      text-shadow: 1px 2px 4px #000;
      pointer-events: none;
    }

    #status {
      position: fixed;
      top: 48px;
      width: 100%;
      z-index: 20;
      text-align: center;
      color: white;
      font-size: 13px;
      text-shadow: 1px 2px 4px #000;
      pointer-events: none;
    }

    #scanning {
      position: fixed;
      bottom: 100px;
      width: 100%;
      z-index: 20;
      text-align: center;
      color: white;
      font-size: 13px;
      text-shadow: 1px 2px 4px #000;
      pointer-events: none;
    }

    #controls {
      position: fixed;
      bottom: 15px;
      left: 0;
      width: 100%;
      z-index: 30;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 8px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 12px 18px;
      background: #1677FF;
      color: white;
      font-size: 14px;
      font-weight: bold;
    }

    #volume {
      width: 85px;
      vertical-align: middle;
    }

    #audioGate {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
      background: rgba(5, 16, 30, 0.94);
      color: white;
      text-align: center;
    }

    #audioGate.hidden {
      display: none;
    }

    .gateContent {
      max-width: 380px;
    }

    .gateContent h2 {
      color: #D6B45C;
      letter-spacing: 2px;
      font-size: 27px;
    }

    #startAR {
      margin-top: 15px;
      padding: 16px 25px;
      background: linear-gradient(135deg, #D6B45C, #A77B25);
      color: #111;
      font-size: 14px;
    }

    /* VIDEO SOURCE */
    #adVideo {
      position: fixed;
      left: -1000px;
      top: 0;
      width: 320px;
      height: 568px;
      opacity: 0.01;
      pointer-events: none;
    }

    .a-canvas {
      position: fixed !important;
      inset: 0 !important;
    }
  </style>
</head>

<body>

  <div id="header">THE HARBRO AR LAB</div>

  <div id="status">
    Menyiapkan kamera AR...
  </div>

  <div id="scanning">
    Arahkan kamera ke marker THE HARBRO
  </div>

  <!-- AKTIVASI SUARA DAN KAMERA -->
  <div id="audioGate">
    <div class="gateContent">
      <h2>THE HARBRO</h2>

      <p>PREMIUM HOLOGRAPHIC ADVERTISING</p>

      <p>
        Aktifkan pengalaman Augmented Reality.
        Izinkan akses kamera dan suara ketika diminta.
      </p>

      <button id="startAR">
        AKTIFKAN AR & SUARA
      </button>
    </div>
  </div>

  <!-- KONTROL SUARA -->
  <div id="controls">

    <button id="mute">MUTE</button>

    <label style="color:white">
      Volume
      <input
        id="volume"
        type="range"
        min="0"
        max="1"
        step="0.1"
        value="1">
    </label>

  </div>

  <!-- VIDEO IKLAN -->
  <video
    id="adVideo"
    src="./assets/video/iklan.mp4"
    preload="auto"
    loop
    playsinline
    webkit-playsinline
    crossorigin="anonymous">
  </video>

  <!-- MINDAR AR SCENE -->
  <a-scene
    id="arScene"
    mindar-image="
      imageTargetSrc: ./assets/targets.mind;
      autoStart: false;
      maxTrack: 1;
      filterMinCF: 0.0001;
      filterBeta: 0.001"
    color-space="sRGB"
    renderer="
      colorManagement: true;
      physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <!-- IMAGE TARGET -->
    <a-entity id="marker" mindar-image-target="targetIndex: 0">

      <!-- 1. GOLDEN LIGHT -->
      <a-plane
        id="goldBase"
        position="0 0 0.025"
        width="0.85"
        height="0.12"
        material="
          color: #FFD76A;
          emissive: #FFD000;
          emissiveIntensity: 2;
          transparent: true;
          opacity: 0;
          side: double">
      </a-plane>

      <!-- GOLDEN GLOW -->
      <a-plane
        id="goldGlow"
        position="0 0 0.02"
        width="1"
        height="0.25"
        material="
          color: #D6B45C;
          emissive: #D6B45C;
          emissiveIntensity: 2;
          transparent: true;
          opacity: 0;
          side: double">
      </a-plane>

      <!-- HOLOGRAM RIG -->
      <!-- Menghadap kamera HP -->
      <a-entity
        id="holoRig"
        position="0 0 0.08"
        rotation="270 0 0"
        visible="false">

        <!-- VERTICAL REVEAL -->
        <a-entity id="revealRig">

          <!-- GOLD FRAME: ATAS -->
          <a-box
            position="0 0.51 0"
            width="0.66"
            height="0.025"
            depth="0.025"
            material="
              color: #D6B45C;
              emissive: #D6B45C;
              emissiveIntensity: 1.5">
          </a-box>

          <!-- GOLD FRAME: BAWAH -->
          <a-box
            position="0 -0.51 0"
            width="0.66"
            height="0.025"
            depth="0.025"
            material="
              color: #D6B45C;
              emissive: #D6B45C;
              emissiveIntensity: 1.5">
          </a-box>

          <!-- GOLD FRAME: KIRI -->
          <a-box
            position="-0.305 0 0"
            width="0.025"
            height="1.02"
            depth="0.025"
            material="
              color: #D6B45C;
              emissive: #D6B45C;
              emissiveIntensity: 1.5">
          </a-box>

          <!-- GOLD FRAME: KANAN -->
          <a-box
            position="0.305 0 0"
            width="0.025"
            height="1.02"
            depth="0.025"
            material="
              color: #D6B45C;
              emissive: #D6B45C;
              emissiveIntensity: 1.5">
          </a-box>

          <!-- VIDEO VERTICAL 9:16 -->
          <a-video
            id="videoScreen"
            src="#adVideo"
            position="0 0 0.025"
            width="0.5625"
            height="1"
            material="shader: flat; side: double">
          </a-video>

          <!-- GLOW LAYER -->
          <a-plane
            id="screenGlow"
            position="0 0 0.015"
            width="0.62"
            height="1.08"
            material="
              color: #55B9F2;
              emissive: #55B9F2;
              emissiveIntensity: 1.5;
              transparent: true;
              opacity: 0;
              side: double">
          </a-plane>

        </a-entity>
      </a-entity>

      <!-- GOLDEN PARTICLES -->
      <a-entity
        id="particleRig"
        position="0 0 0.12"
        visible="false">
      </a-entity>

    </a-entity>

  </a-scene>

  <script>

    const video = document.querySelector("#adVideo");
    const scene = document.querySelector("#arScene");
    const marker = document.querySelector("#marker");

    const status = document.querySelector("#status");
    const scanning = document.querySelector("#scanning");

    const holoRig = document.querySelector("#holoRig");
    const revealRig = document.querySelector("#revealRig");

    const goldBase = document.querySelector("#goldBase");
    const goldGlow = document.querySelector("#goldGlow");
    const screenGlow = document.querySelector("#screenGlow");

    const particleRig = document.querySelector("#particleRig");

    const audioGate = document.querySelector("#audioGate");
    const startButton = document.querySelector("#startAR");

    const muteButton = document.querySelector("#mute");
    const volume = document.querySelector("#volume");

    let audioUnlocked = false;
    let markerVisible = false;
    let animationRunning = false;
    let animationId = null;

    let particles = [];

    video.muted = true;
    video.volume = 1;

    // EASING
    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    // BUAT PARTIKEL EMAS
    function createParticles() {

      if (particles.length > 0) return;

      for (let i = 0; i < 22; i++) {

        const p = document.createElement("a-sphere");

        const x = (Math.random() - 0.5) * 0.85;
        const y = Math.random() * 1.2;
        const z = 0.04;

        const radius = 0.004 + Math.random() * 0.008;

        p.setAttribute("radius", radius);

        p.setAttribute("position", {
          x: x,
          y: y,
          z: z
        });

        p.setAttribute("material", {
          color: "#FFD76A",
          emissive: "#D6B45C",
          emissiveIntensity: 2,
          transparent: true,
          opacity: 0.9
        });

        particleRig.appendChild(p);

        particles.push({
          element: p,
          x: x,
          y: y,
          z: z,
          speed: 0.15 + Math.random() * 0.3,
          phase: Math.random() * 6.28
        });
      }
    }

    // RESET HOLOGRAM
    function resetAnimation() {

      if (animationId) {
        cancelAnimationFrame(animationId);
        animationId = null;
      }

      animationRunning = false;

      holoRig.object3D.position.set(0, 0, 0.08);

      // UKURAN HOLOGRAM 2X
      // X = lebar, Y = tinggi, Z = kedalaman
      revealRig.object3D.scale.set(2, 0.001, 2);

      goldBase.object3D.scale.set(0.001, 1, 1);
      goldGlow.object3D.scale.set(0.001, 1, 1);

      goldBase.setAttribute("material", "opacity", 0);
      goldGlow.setAttribute("material", "opacity", 0);
      screenGlow.setAttribute("material", "opacity", 0);

      particles.forEach(p => {
        p.element.setAttribute("visible", false);
      });

      holoRig.setAttribute("visible", false);
      particleRig.setAttribute("visible", false);
    }

    // LIMA EFEK HOLOGRAM
    function startAnimation() {

      if (animationRunning) return;

      resetAnimation();

      animationRunning = true;

      holoRig.setAttribute("visible", true);
      particleRig.setAttribute("visible", true);

      particles.forEach(p => {
        p.element.setAttribute("visible", true);
      });

      const duration = 3200;
      const startTime = performance.now();

      function animate(now) {

        if (!animationRunning || !markerVisible) return;

        const progress = Math.min(
          (now - startTime) / duration,
          1
        );

        const eased = easeOutCubic(progress);

        // 1. GOLDEN LIGHT
        const lightSize = Math.min(progress * 2.2, 1);

        goldBase.object3D.scale.x = 0.001 + lightSize;
        goldGlow.object3D.scale.x = 0.001 + lightSize;

        const lightOpacity =
          progress < 0.7
            ? 0.9
            : 0.9 * (1 - (progress - 0.7) / 0.3);

        goldBase.setAttribute(
          "material",
          "opacity",
          lightOpacity
        );

        goldGlow.setAttribute(
          "material",
          "opacity",
          lightOpacity * 0.25
        );

        // 2. VERTICAL RISE
        holoRig.object3D.position.y = 0.58 * eased;

        // 3. VERTICAL REVEAL
        // Tinggi akhir 2x, lebar tetap 2x
        revealRig.object3D.scale.y =
          Math.max(0.001, 2 * eased);

        // 4. GOLDEN PARTICLES
        const elapsed = (now - startTime) / 1000;

        particles.forEach(p => {

          const y = (p.y + elapsed * p.speed) % 1.3;

          const x =
            p.x + Math.sin(elapsed * 2 + p.phase) * 0.025;

          p.element.object3D.position.set(
            x,
            y,
            p.z
          );
        });

        // 5. HOLOGRAPHIC GLOW
        const glowOpacity =
          0.18 + Math.sin(now * 0.004) * 0.12;

        screenGlow.setAttribute(
          "material",
          "opacity",
          glowOpacity
        );

        if (progress >= 1) {

          animationRunning = false;
          animationId = null;

          goldBase.setAttribute("material", "opacity", 0);
          goldGlow.setAttribute("material", "opacity", 0);

          status.textContent = "THE HARBRO HOLOGRAM ACTIVE";

          return;
        }

        animationId = requestAnimationFrame(animate);
      }

      animationId = requestAnimationFrame(animate);
    }

    // PUTAR VIDEO
    async function playAdvertisement() {

      if (!markerVisible) return;

      video.volume = Number(volume.value);

      try {

        await video.play();

        status.textContent = video.muted
          ? "HOLOGRAM ACTIVE - SOUND MUTED"
          : "HOLOGRAPHIC ADVERTISEMENT PLAYING";

      } catch (error) {

        console.error("Video playback error:", error);

        // COBA PUTAR TANPA SUARA
        try {

          video.muted = true;
          await video.play();

          status.textContent = "VIDEO PLAYING - SOUND MUTED";

        } catch (secondError) {

          status.textContent = "Video gagal diputar. Periksa file MP4.";

          console.error(secondError);
        }
      }
    }

    // AKTIFKAN KAMERA DAN SUARA
    startButton.addEventListener("click", async () => {

      startButton.disabled = true;
      status.textContent = "Mengaktifkan kamera dan suara...";

      try {

        // BUKA IZIN AUDIO BROWSER
        video.muted = false;
        video.volume = Number(volume.value);

        const soundPromise = video.play();

        // MULAI MINDAR
        const arSystem = scene.systems["mindar-image-system"];

        if (!arSystem) {
          throw new Error("MindAR belum siap. Muat ulang halaman.");
        }

        const cameraPromise = arSystem.start();

        await soundPromise;

        video.pause();
        video.currentTime = 0;

        audioUnlocked = true;

        audioGate.classList.add("hidden");

        status.textContent = "Kamera aktif - Arahkan ke marker";

        await cameraPromise;

      } catch (error) {

        console.error("AR start error:", error);

        status.textContent =
          "Gagal mengaktifkan kamera. Periksa izin kamera browser.";

        startButton.disabled = false;
      }
    });

    // MUTE / UNMUTE
    muteButton.addEventListener("click", () => {

      video.muted = !video.muted;

      muteButton.textContent =
        video.muted ? "UNMUTE" : "MUTE";

      if (!video.muted && markerVisible) {
        video.play().catch(error => console.log(error));
      }
    });

    // VOLUME
    volume.addEventListener("input", () => {

      video.volume = Number(volume.value);

      if (video.volume === 0) {
        video.muted = true;
        muteButton.textContent = "UNMUTE";
      } else {
        video.muted = false;
        muteButton.textContent = "MUTE";
      }
    });

    // MARKER TERDETEKSI
    marker.addEventListener("targetFound", () => {

      markerVisible = true;

      scanning.textContent = "THE HARBRO MARKER DETECTED";

      status.textContent = "Golden Hologram Emerging...";

      startAnimation();

      playAdvertisement();
    });

    // MARKER HILANG
    marker.addEventListener("targetLost", () => {

      markerVisible = false;

      scanning.textContent = "Mencari marker THE HARBRO...";

      status.textContent = "Marker tidak terlihat";

      video.pause();
      video.currentTime = 0;

      resetAnimation();
    });

    // PERSIAPAN AWAL
    createParticles();
    resetAnimation();

    video.addEventListener("error", () => {
      status.textContent = "Tidak dapat memuat iklan MP4.";
      console.error("Video error:", video.error);
    });

    video.addEventListener("loadeddata", () => {
      console.log("Video iklan berhasil dimuat.");
    });

  </script>

</body>
</html>
