    id="backWrap"
            position="0 0 -0.01"
            rotation="0 180 0">

            <a-plane
              id="videoScreenBack"
              width="0.5625"
              height="1"
              material="
                shader: harbro-chroma;
                src: #adVideo;
                threshold: 0.25;
                softness: 0.15;
                transparent: true;
                side: double;
                depthWrite: false">
            </a-plane>

          </a-entity>

          <!-- GLOW LAYER -->
          <a-plane
            id="screenGlow"
            position="0 0 0"
            width="0.59"
            height="1.04"
            material="
              color: #55B9F2;
              emissive: #55B9F2;
              emissiveIntensity: 1.5;
              transparent: true;
              opacity: 0;
              side: double">
          </a-plane>

        </a-entity>
      </a-entity>

      <!-- GOLDEN PARTICLES -->
      <a-entity
        id="particleRig"
        position="0 0 0"
        rotation="90 0 0"
        visible="false">
      </a-entity>

    </a-entity>

  </a-scene>

  <script>

    const video = document.querySelector("#adVideo");
    const scene = document.querySelector("#arScene");
    const marker = document.querySelector("#marker");

    const status = document.querySelector("#status");
    const scanning = document.querySelector("#scanning");

    const holoRig = document.querySelector("#holoRig");
    const revealRig = document.querySelector("#revealRig");

    const goldBase = document.querySelector("#goldBase");
    const goldGlow = document.querySelector("#goldGlow");
    const screenGlow = document.querySelector("#screenGlow");

    const particleRig = document.querySelector("#particleRig");

    const videoFront = document.querySelector("#videoScreen");
    const videoBack = document.querySelector("#videoScreenBack");

    const audioGate = document.querySelector("#audioGate");
    const startButton = document.querySelector("#startAR");

    const muteButton = document.querySelector("#mute");
    const volume = document.querySelector("#volume");

    // ===== BLACK REMOVAL CONTROLS =====

    const thresholdSlider =
      document.querySelector("#thresholdSlider");

    const softnessSlider =
      document.querySelector("#softnessSlider");

    const thresholdValue =
      document.querySelector("#thresholdValue");

    const softnessValue =
      document.querySelector("#softnessValue");

    const resetKey =
      document.querySelector("#resetKey");

    let blackThreshold = 0.25;
    let edgeSoftness = 0.15;

    function applyBlackRemoval() {

      blackThreshold =
        Number(thresholdSlider.value) / 100;

      edgeSoftness =
        Number(softnessSlider.value) / 100;

      thresholdValue.textContent =
        thresholdSlider.value + "%";

      softnessValue.textContent =
        softnessSlider.value + "%";

      [videoFront, videoBack].forEach(el => {

        el.setAttribute(
          "material",
          "threshold",
          blackThreshold
        );

        el.setAttribute(
          "material",
          "softness",
          edgeSoftness
        );

      });

    }

    thresholdSlider.addEventListener(
      "input",
      applyBlackRemoval
    );

    softnessSlider.addEventListener(
      "input",
      applyBlackRemoval
    );

    resetKey.addEventListener("click", () => {

      thresholdSlider.value = 25;
      softnessSlider.value = 15;

      applyBlackRemoval();

    });

    // ===== HOLOGRAM SIZE =====

    const HOLO_SCALE = 1.2;
    const HOLO_LIFT = 0.5 * HOLO_SCALE + 0.03;

    // ===== VIDEO CROP =====

    const CROP = 1.0;

    function applyCrop() {

      const offset = (1 - CROP) / 2;

      [videoFront, videoBack].forEach(el => {

        el.setAttribute(
          "material",
          "repeat",
          CROP + " " + CROP
        );

        el.setAttribute(
          "material",
          "offset",
          offset + " " + offset
        );

      });

    }

    // ===== VIDEO ORIENTATION =====

    let vRot = 0;
    let vFlipX = 1;
    let vFlipY = 1;

    try {

      const saved = JSON.parse(
        localStorage.getItem("harbroVideoOrient")
      );

      if (saved) {

        vRot = saved.vRot;
        vFlipX = saved.vFlipX;
        vFlipY = saved.vFlipY;

      }

    } catch (e) {}

    function applyVideoOrientation() {

      [videoFront, videoBack].forEach(el => {

        if (!el.object3D) return;

        el.object3D.rotation.z =
          THREE.MathUtils.degToRad(vRot);

        el.object3D.scale.set(
          vFlipX,
          vFlipY,
          1
        );

      });

      try {

        localStorage.setItem(
          "harbroVideoOrient",
          JSON.stringify({
            vRot,
            vFlipX,
            vFlipY
          })
        );

      } catch (e) {}

    }

    document.querySelector("#rot180")
      .addEventListener("click", () => {

        vRot = vRot === 0 ? 180 : 0;

        applyVideoOrientation();

      });

    document.querySelector("#flipV")
      .addEventListener("click", () => {

        vFlipY = -vFlipY;

        applyVideoOrientation();

      });

    document.querySelector("#flipH")
      .addEventListener("click", () => {

        vFlipX = -vFlipX;

        applyVideoOrientation();

      });

    scene.addEventListener("loaded", () => {

      applyVideoOrientation();
      applyCrop();
      applyBlackRemoval();

    });

    // ===== ANIMATION VARIABLES =====

    let markerVisible = false;
    let animationRunning = false;
    let animationId = null;

    let particles = [];

    video.muted = true;
    video.volume = 1;

    function easeOutCubic(t) {

      return 1 - Math.pow(1 - t, 3);

    }

    // ===== CREATE GOLD PARTICLES =====

    function createParticles() {

      if (particles.length > 0) return;

      for (let i = 0; i < 22; i++) {

        const p = document.createElement("a-sphere");

        const x =
          (Math.random() - 0.5) * 0.85;

        const y =
          Math.random() * 1.2;

        const z =
          (Math.random() - 0.5) * 0.1;

        const radius =
          0.004 + Math.random() * 0.008;

        p.setAttribute("radius", radius);

        p.setAttribute("position", {
          x: x,
          y: y,
          z: z
        });

        p.setAttribute("material", {
          color: "#FFD76A",
          emissive: "#D6B45C",
          emissiveIntensity: 2,
          transparent: true,
          opacity: 0.9
        });

        particleRig.appendChild(p);

        particles.push({

          element: p,
          x: x,
          y: y,
          z: z,

          speed: 0.15 + Math.random() * 0.3,

          phase: Math.random() * 6.28

        });

      }

    }

    // ===== RESET HOLOGRAM =====

    function resetAnimation() {

      if (animationId) {

        cancelAnimationFrame(animationId);
        animationId = null;

      }

      animationRunning = false;

      holoRig.object3D.position.set(0, 0, 0);

      revealRig.object3D.scale.set(
        HOLO_SCALE,
        0.001,
        HOLO_SCALE
      );

      goldBase.object3D.scale.set(
        0.001, 1, 1
      );

      goldGlow.object3D.scale.set(
        0.001, 1, 1
      );

      goldBase.setAttribute(
        "material", "opacity", 0
      );

      goldGlow.setAttribute(
        "material", "opacity", 0
      );

      screenGlow.setAttribute(
        "material", "opacity", 0
      );

      particles.forEach(p => {

        p.element.setAttribute("visible", false);

      });

      holoRig.setAttribute("visible", false);
      particleRig.setAttribute("visible", false);

    }

    // ===== HOLOGRAM EMERGING ANIMATION =====

    function startAnimation() {

      if (animationRunning) return;

      resetAnimation();

      animationRunning = true;

      holoRig.setAttribute("visible", true);
      particleRig.setAttribute("visible", true);

      particles.forEach(p => {

        p.element.setAttribute("visible", true);

      });

      const duration = 3200;
      const startTime = performance.now();

      function animate(now) {

        if (!animationRunning || !markerVisible) return;

        const progress = Math.min(
          (now - startTime) / duration,
          1
        );

        const eased = easeOutCubic(progress);

        // 1. GOLDEN LIGHT

        const lightSize = Math.min(
          progress * 2.2,
          1
        );

        goldBase.object3D.scale.x =
          0.001 + lightSize;

        goldGlow.object3D.scale.x =
          0.001 + lightSize;

        const lightOpacity =
          progress < 0.7
            ? 0.9
            : 0.9 * (1 - (progress - 0.7) / 0.3);

        goldBase.setAttribute(
          "material",
          "opacity",
          lightOpacity
        );

        goldGlow.setAttribute(
          "material",
          "opacity",
          lightOpacity * 0.25
        );

        // 2. RISE UP

        holoRig.object3D.position.z =
          HOLO_LIFT * eased;

        // 3. REVEAL VIDEO

        revealRig.object3D.scale.y =
          Math.max(
            0.001,
            HOLO_SCALE * eased
          );

        // 4. GOLD PARTICLES

        const elapsed =
          (now - startTime) / 1000;

        particles.forEach(p => {

          const y =
            (p.y + elapsed * p.speed) % 1.3;

          const x =
            p.x +
            Math.sin(elapsed * 2 + p.phase) * 0.025;

          p.element.object3D.position.set(
            x, y, p.z
          );

        });

        // 5. BLUE GLOW

        const glowOpacity =
          0.18 + Math.sin(now * 0.004) * 0.12;

        screenGlow.setAttribute(
          "material",
          "opacity",
          glowOpacity
        );

        if (progress >= 1) {

          animationRunning = false;
          animationId = null;

          goldBase.setAttribute(
            "material", "opacity", 0
          );

          goldGlow.setAttribute(
            "material", "opacity", 0
          );

          status.textContent =
            "THE HARBRO HOLOGRAM ACTIVE";

          return;

        }

        animationId =
          requestAnimationFrame(animate);

      }

      animationId =
        requestAnimationFrame(animate);

    }

    // ===== PLAY ADVERTISEMENT =====

    async function playAdvertisement() {

      if (!markerVisible) return;

      video.volume = Number(volume.value);

      try {

        await video.play();

        status.textContent = video.muted
          ? "HOLOGRAM ACTIVE - SOUND MUTED"
          : "HOLOGRAPHIC ADVERTISEMENT PLAYING";

      } catch (error) {

        console.error(
          "Video playback error:",
          error
        );

        try {

          video.muted = true;

          await video.play();

          status.textContent =
            "VIDEO PLAYING - SOUND MUTED";

        } catch (secondError) {

          status.textContent =
            "Video gagal diputar. Periksa file MP4.";

          console.error(secondError);

        }

      }

    }

    // ===== START CAMERA AND AUDIO =====

    startButton.addEventListener(
      "click",
      async () => {

        startButton.disabled = true;

        status.textContent =
          "Mengaktifkan kamera dan suara...";

        try {

          video.muted = false;

          video.volume =
            Number(volume.value);

          const soundPromise = video.play();

          const arSystem =
            scene.systems["mindar-image-system"];

          if (!arSystem) {

            throw new Error(
              "MindAR belum siap. Muat ulang halaman."
            );

          }

          const cameraPromise = arSystem.start();

          await soundPromise;

          video.pause();
          video.currentTime = 0;

          audioGate.classList.add("hidden");

          status.textContent =
            "Kamera aktif - Arahkan ke marker";

          await cameraPromise;

        } catch (error) {

          console.error(
            "AR start error:",
            error
          );

          status.textContent =
            "Gagal mengaktifkan kamera. Periksa izin kamera browser.";

          startButton.disabled = false;

        }

      }
    );

    // ===== MUTE / UNMUTE =====

    muteButton.addEventListener("click", () => {

      video.muted = !video.muted;

      muteButton.textContent =
        video.muted ? "UNMUTE" : "MUTE";

      if (!video.muted && markerVisible) {

        video.play().catch(
          error => console.log(error)
        );

      }

    });

    // ===== VOLUME =====

    volume.addEventListener("input", () => {

      video.volume =
        Number(volume.value);

      if (video.volume === 0) {

        video.muted = true;

        muteButton.textContent = "UNMUTE";

      } else {

        video.muted = false;

        muteButton.textContent = "MUTE";

      }

    });

    // ===== MARKER FOUND =====

    marker.addEventListener(
      "targetFound",
      () => {

        markerVisible = true;

        scanning.textContent =
          "THE HARBRO MARKER DETECTED";

        status.textContent =
          "Golden Hologram Emerging...";

        applyVideoOrientation();
        applyCrop();
        applyBlackRemoval();

        startAnimation();
        playAdvertisement();

      }
    );

    // ===== MARKER LOST =====

    marker.addEventListener(
      "targetLost",
      () => {

        markerVisible = false;

        scanning.textContent =
          "Mencari marker THE HARBRO...";

        status.textContent =
          "Marker tidak terlihat";

        video.pause();
        video.currentTime = 0;

        resetAnimation();

      }
    );

    // ===== INITIALIZATION =====

    createParticles();

    resetAnimation();

    applyBlackRemoval();

    video.addEventListener("error", () => {

      status.textContent =
        "Tidak dapat memuat iklan MP4.";

      console.error(
        "Video error:",
        video.error
      );

    });

    video.addEventListener("loadeddata", () => {

      console.log(
        "Video iklan berhasil dimuat."
      );

    });

  </script>

</body>
</html>
