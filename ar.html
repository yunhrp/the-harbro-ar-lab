
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>THE HARBRO AR LAB</title>

  <!-- A-Frame dan MindAR -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    .brand {
      position: fixed;
      top: 12px;
      left: 0;
      width: 100%;
      text-align: center;
      color: #D6B45C;
      font-size: 15px;
      font-weight: bold;
      letter-spacing: 3px;
      z-index: 10;
      pointer-events: none;
      text-shadow: 0 0 12px #D6B45C;
    }

    #status {
      position: fixed;
      top: 42px;
      left: 50%;
      transform: translateX(-50%);
      width: max-content;
      max-width: 90%;
      padding: 8px 14px;
      border-radius: 20px;
      background: rgba(0,0,0,.65);
      color: white;
      font-size: 12px;
      text-align: center;
      z-index: 10;
    }

    #startScreen {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 25px;
      text-align: center;
      color: white;
      background: rgba(0,0,0,.88);
    }

    #startScreen h1 {
      color: #D6B45C;
      letter-spacing: 3px;
      font-size: 23px;
    }

    #startScreen p {
      max-width: 330px;
      line-height: 1.6;
      font-size: 14px;
    }

    button {
      border: 1px solid #D6B45C;
      border-radius: 25px;
      padding: 12px 20px;
      color: #fff;
      background: linear-gradient(135deg, #8c6824, #D6B45C);
      font-weight: bold;
      cursor: pointer;
    }

    #controls {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 95%;
      padding: 9px;
      border-radius: 30px;
      background: rgba(0,0,0,.72);
    }

    #controls button {
      padding: 9px 13px;
      font-size: 12px;
      white-space: nowrap;
    }

    #volume {
      width: 75px;
      accent-color: #D6B45C;
    }

    .a-enter-vr,
    .a-enter-ar {
      display: none !important;
    }
  </style>
</head>

<body>

  <div class="brand">THE HARBRO AR LAB</div>
  <div id="status">Menyiapkan kamera AR...</div>

  <!-- Tombol aktivasi awal -->
  <div id="startScreen">
    <h1>THE HARBRO</h1>
    <p>
      Selamat datang di pengalaman Augmented Reality.
      Aktifkan kamera dan suara, kemudian arahkan kamera
      HP ke marker Harbro.
    </p>
    <button id="startButton">AKTIFKAN AR & SUARA</button>
    <p style="font-size:11px;color:#ccc">
      Izinkan akses kamera ketika browser memintanya.
    </p>
  </div>

  <!-- Kontrol video -->
  <div id="controls">
    <button id="playButton">PAUSE</button>
    <button id="muteButton">MUTE</button>
    <input id="volume" type="range" min="0" max="1"
           step="0.05" value="1">
  </div>

  <a-scene
    mindar-image="
      imageTargetSrc: ./assets/targets.mind;
      autoStart: true;
      uiLoading: no;
      uiScanning: no;
      filterMinCF: 0.0001;
      filterBeta: 0.001;
      maxTrack: 1;
    "
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded
  >

    <a-assets timeout="15000">
      <video
        id="adVideo"
        src="./assets/video/iklan.mp4"
        preload="auto"
        playsinline
        webkit-playsinline
        crossorigin="anonymous"
      ></video>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
      active="true"
    ></a-camera>

    <!-- MARKER -->
    <a-entity id="marker" mindar-image-target="targetIndex: 0">

      <!--
        Billboard membuat layar hologram menghadap kamera.
        Posisi tetap mengikuti bidang marker.
      -->
      <a-entity
        id="holoRig"
        billboard-camera
        position="0 0 0.08"
        visible="false"
      >

        <!-- EFEK 1: GOLDEN LIGHT -->
        <a-ring
          id="goldLight"
          position="0 0 -0.04"
          rotation="0 0 0"
          radius-inner="0.38"
          radius-outer="0.48"
          color="#D6B45C"
          material="shader: flat; transparent: true; opacity: 0.8; side: double"
          scale="0.1 0.1 0.1"
          animation__pulse="
            property: scale;
            from: 0.1 0.1 0.1;
            to: 1.7 1.7 1.7;
            dur: 1400;
            easing: easeOutCubic;
            startEvents: pulse;
          "
          animation__fade="
            property: material.opacity;
            from: 0.8;
            to: 0;
            dur: 1400;
            startEvents: pulse;
          "
        ></a-ring>

        <!-- EFEK 5: HOLOGRAPHIC GLOW -->
        <a-plane
          position="0 0 -0.035"
          width="0.72"
          height="1.20"
          material="
            shader: flat;
            color: #D6B45C;
            transparent: true;
            opacity: 0.28;
            side: double;
          "
          animation__glow="
            property: material.opacity;
            from: 0.08;
            to: 0.30;
            dir: alternate;
            dur: 900;
            loop: true;
            startEvents: glow;
          "
        ></a-plane>

        <!-- EFEK 3: VERTICAL REVEAL -->
        <a-entity
          id="revealRig"
          position="0 0 0"
          scale="1 0.01 1"
          animation__reveal="
            property: scale;
            from: 1 0.01 1;
            to: 1 1 1;
            dur: 1300;
            easing: easeOutCubic;
            startEvents: reveal;
          "
        >

          <!-- Video 9:16 -->
          <a-video
            src="#adVideo"
            position="0 0 0.025"
            width="0.5625"
            height="1"
            material="shader: flat; side: double"
          ></a-video>

          <!-- FRAME EMAS -->
          <a-box
            position="0 0.525 0"
            width="0.66"
            height="0.035"
            depth="0.035"
            color="#D6B45C"
            material="metalness: 0.7; roughness: 0.25"
          ></a-box>

          <a-box
            position="0 -0.525 0"
            width="0.66"
            height="0.035"
            depth="0.035"
            color="#D6B45C"
            material="metalness: 0.7; roughness: 0.25"
          ></a-box>

          <a-box
            position="-0.3125 0 0"
            width="0.035"
            height="1.08"
            depth="0.035"
            color="#D6B45C"
          ></a-box>

          <a-box
            position="0.3125 0 0"
            width="0.035"
            height="1.08"
            depth="0.035"
            color="#D6B45C"
          ></a-box>

        </a-entity>

        <!-- EFEK 4: GOLDEN PARTICLES -->
        <a-entity id="particleRig"></a-entity>

      </a-entity>
    </a-entity>

  </a-scene>

  <script>
    /*
      BILLBOARD CAMERA

      Membuat bidang hologram selalu menghadap kamera,
      sementara posisinya tetap mengikuti marker.
    */
    AFRAME.registerComponent('billboard-camera', {
      tick: function () {
        const camera = this.el.sceneEl.camera;
        if (!camera) return;

        const parent = this.el.object3D.parent;
        if (!parent) return;

        const cameraWorld = new THREE.Quaternion();
        const parentWorld = new THREE.Quaternion();

        camera.getWorldQuaternion(cameraWorld);
        parent.getWorldQuaternion(parentWorld);

        this.el.object3D.quaternion.copy(
          parentWorld.invert().multiply(cameraWorld)
        );
      }
    });

    const video = document.querySelector('#adVideo');
    const scene = document.querySelector('a-scene');
    const marker = document.querySelector('#marker');
    const holoRig = document.querySelector('#holoRig');
    const revealRig = document.querySelector('#revealRig');
    const goldLight = document.querySelector('#goldLight');
    const particleRig = document.querySelector('#particleRig');

    const statusText = document.querySelector('#status');
    const startScreen = document.querySelector('#startScreen');

    const startButton = document.querySelector('#startButton');
    const playButton = document.querySelector('#playButton');
    const muteButton = document.querySelector('#muteButton');
    const volumeControl = document.querySelector('#volume');

    let audioUnlocked = false;
    let isPlaying = false;
    let isMuted = false;

    video.loop = false;
    video.muted = true;
    video.volume = 1;

    // Membuat 22 partikel emas
    for (let i = 0; i < 22; i++) {
      const particle = document.createElement('a-sphere');

      const x = (Math.random() - 0.5) * 0.75;
      const y = (Math.random() - 0.5) * 1.25;
      const z = 0.06 + Math.random() * 0.05;

      particle.setAttribute('radius', 0.009 + Math.random() * 0.012);
      particle.setAttribute('color', '#D6B45C');

      particle.setAttribute('material',
        'shader: flat; transparent: true; opacity: 0.85'
      );

      particle.setAttribute('position', `${x} ${y} ${z}`);

      particle.setAttribute('animation__float', {
        property: 'position',
        to: `${x * 1.3} ${y + 0.25} ${z}`,
        dur: 1200 + Math.random() * 1800,
        dir: 'alternate',
        loop: true,
        easing: 'easeInOutSine'
      });

      particleRig.appendChild(particle);
    }

    // Aktivasi AR dan suara melalui interaksi pengguna
    startButton.addEventListener('click', async () => {
      try {
        video.muted = false;
        video.volume = Number(volumeControl.value);

        await video.play();
        video.pause();
        video.currentTime = 0;

        audioUnlocked = true;
        startScreen.style.display = 'none';

        statusText.textContent = 'Kamera aktif. Arahkan ke marker Harbro.';
      } catch (error) {
        video.muted = true;
        audioUnlocked = false;

        startScreen.style.display = 'none';
        statusText.textContent =
          'Kamera aktif. Suara mungkin memerlukan aktivasi ulang.';
      }
    });

    // Saat marker ditemukan
    marker.addEventListener('targetFound', async () => {
      statusText.textContent = 'MARKER TERDETEKSI - HOLOGRAM AKTIF';

      holoRig.setAttribute('visible', true);

      // Reset posisi animasi
      holoRig.object3D.position.z = 0.08;
      revealRig.object3D.scale.set(1, 0.01, 1);

      goldLight.object3D.scale.set(0.1, 0.1, 0.1);

      // EFEK 1: cahaya emas mengembang
      goldLight.emit('pulse');

      // EFEK 2: hologram naik dari marker
      holoRig.setAttribute('animation__rise', {
        property: 'position',
        from: '0 0 0.08',
        to: '0 0 0.68',
        dur: 1200,
        easing: 'easeOutCubic'
      });

      // EFEK 3: layar terbuka dari bawah
      revealRig.emit('reveal');

      // EFEK 5: cahaya hologram
      holoRig.querySelector('a-plane').emit('glow');

      // Memulai video
      try {
        video.muted = !audioUnlocked || isMuted;
        video.volume = Number(volumeControl.value);

        await video.play();

        isPlaying = true;
        playButton.textContent = 'PAUSE';
      } catch (error) {
        statusText.textContent =
          'Marker ditemukan. Tekan tombol Play untuk video.';
      }
    });

    // Saat marker hilang
    marker.addEventListener('targetLost', () => {
      statusText.textContent = 'Marker tidak terlihat. Cari kembali marker.';

      video.pause();
      video.currentTime = 0;

      isPlaying = false;
      playButton.textContent = 'PLAY';

      holoRig.setAttribute('visible', false);
      holoRig.object3D.position.z = 0.08;

      revealRig.object3D.scale.set(1, 0.01, 1);
      goldLight.object3D.scale.set(0.1, 0.1, 0.1);
    });

    // Kontrol Play / Pause
    playButton.addEventListener('click', async () => {
      if (video.paused) {
        try {
          await video.play();
          isPlaying = true;
          playButton.textContent = 'PAUSE';
        } catch (error) {
          statusText.textContent = 'Video belum bisa diputar.';
        }
      } else {
        video.pause();
        isPlaying = false;
        playButton.textContent = 'PLAY';
      }
    });

    // Kontrol Mute
    muteButton.addEventListener('click', () => {
      isMuted = !isMuted;
      video.muted = isMuted;

      muteButton.textContent = isMuted ? 'UNMUTE' : 'MUTE';
    });

    // Kontrol volume
    volumeControl.addEventListener('input', () => {
      video.volume = Number(volumeControl.value);
    });

    // Status kamera
    scene.addEventListener('arReady', () => {
      statusText.textContent = 'Kamera siap. Silakan scan marker.';
    });

    scene.addEventListener('arError', () => {
      statusText.textContent =
        'Kamera gagal dibuka. Periksa izin kamera dan koneksi HTTPS.';
    });

    video.addEventListener('ended', () => {
      isPlaying = false;
      playButton.textContent = 'PLAY';
    });
  </script>

</body>
</html>
